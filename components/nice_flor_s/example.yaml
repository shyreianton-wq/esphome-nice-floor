# Exemple de configuration ESPHome pour cloner une Nice FLOR-S
# Mettre les fichiers du dossier `components/nice_flor_s/` dans
#   <ton-projet-esphome>/components/nice_flor_s/
# puis utiliser ce YAML.

esphome:
  name: portail-nice

esp32:
  board: wemos_d1_mini32
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
ota:
  - platform: esphome

logger:
  level: INFO

# --- Composant Nice FLOR-S -----------------------------------------------
external_components:
  - source:
      type: local
      path: components

nice_flor_s:
  id: portail
  cs_pin: 5                    # CC1101 CSN -> GPIO5
  gdo0_pin: 2                  # CC1101 GDO0 -> GPIO2
  serial: 0x12345678           # serial de TA telecommande (a remplacer apres capture)
  button: 1                    # bouton (1..4 typiquement)
  initial_code: 0x0001         # rolling code initial (premier envoi = +1)
  tx_power: 12                 # dBm: -30, -20, -15, -10, 0, 5, 7, 10, 11, 12

# --- Exposition vers Home Assistant --------------------------------------
button:
  - platform: template
    name: "Ouvrir portail"
    id: btn_ouvrir
    on_press:
      - lambda: id(portail).send_open();

# (optionnel) sensor pour suivre le rolling code
sensor:
  - platform: template
    name: "Portail rolling code"
    lambda: return id(portail).get_rolling_code();
    update_interval: 60s

# (optionnel) service pour forcer le rolling code depuis HA
api:
  actions:
    - action: set_rolling_code
      variables:
        code: int
      then:
        - lambda: id(portail).set_rolling_code(code);
